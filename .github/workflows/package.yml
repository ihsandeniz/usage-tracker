name: package

# Ayrı bir dosya, bilerek: ci.yml'de hiçbir kurulum adımı yoktur ve olmamalıdır — sıfır
# bağımlılık sözü orada ölçülür. PyInstaller bir *derleme* aracıdır, çalışma zamanı
# bağımlılığı değil; o yüzden burada yaşar.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Neden elle tetiklendi'
        required: false
        default: 'manual build'

permissions:
  contents: read

jobs:
  windows:
    name: windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install pyinstaller
      - run: pyinstaller packaging/usage-tracker.spec --noconfirm --clean

      - name: The exe starts and serves the wire
        # "Derlendi" ile "çalışıyor" arasındaki farkın CI'da ölçülebilen kısmı burasıdır.
        # Ölçemediği kısım: kurulum akışı, tepsi ikonu, SmartScreen, antivirüs karantinası.
        shell: pwsh
        run: |
          $env:USAGE_PORT = '8770'
          $proc = Start-Process -FilePath dist\usage-tracker.exe -PassThru -NoNewWindow
          $wire = $null
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            try { $wire = Invoke-RestMethod http://127.0.0.1:8770/v1/usage; break } catch { }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          if ($null -eq $wire) { throw 'the exe never answered on 127.0.0.1:8770' }
          if ($wire.schema -ne 'usage/v1') { throw "unexpected schema: $($wire.schema)" }
          $cat = $wire.providers[0].spend.catalog
          Write-Host "schema=$($wire.schema) catalog=$($cat.source) models=$($cat.modelCount)"
          # Windows runner'da ne Hermes ne kullanıcı cache'i vardır: fiyatlar paketin
          # içindeki snapshot'tan gelmek ZORUNDA. Gelmiyorsa .exe verisini kaybetmiş demektir.
          if ($cat.source -ne 'bundled') { throw "expected the bundled catalogue, got $($cat.source)" }
          if ($cat.modelCount -lt 1000)  { throw "bundled catalogue looks empty: $($cat.modelCount)" }

      - name: Static assets survived the bundling
        # Bu adım bir kez "web/ pakete girmedi" diye düştü ve sebep o değildi: dosyalar
        # paketteydi, traversal koruması tabanı **çözülmemiş** tuttuğu için 404 dönüyordu
        # (%TEMP% 8.3 kısa adı). `catch {}` gerçek hatayı yutuyordu — yani adım yanlış
        # suçluyu gösterdi. Son hata ve durum kodu artık log'a düşüyor.
        shell: pwsh
        run: |
          $env:USAGE_PORT = '8772'
          $proc = Start-Process -FilePath dist\usage-tracker.exe -PassThru -NoNewWindow
          $ok = $false
          $last = 'never attempted'
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            try {
              foreach ($p in '/', '/app.js', '/styles.css') {
                $r = Invoke-WebRequest "http://127.0.0.1:8772$p" -UseBasicParsing
                if ($r.StatusCode -ne 200) { throw "$p -> $($r.StatusCode)" }
              }
              $ok = $true; break
            } catch {
              $code = $_.Exception.Response.StatusCode.value__
              $last = if ($code) { "$($_.Exception.Message) (HTTP $code)" }
                      else { $_.Exception.Message }
            }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          if (-not $ok) {
            # 404 = paket sağlam, yol karşılaştırması bozuk. Bağlantı hatası = süreç ölü.
            throw "the panel never served its files — last error: $last"
          }

      - name: The exe is also the CLI
        # Tek giriş noktası: pakette ikinci bir çalıştırılabilir yok, `usage-tracker.exe
        # guard` çalışmak ZORUNDA. Kaçırılması kolay bir hata sınıfı — paket sorunsuz
        # açılır, sunucu çalışır, yalnız CLI "böyle bir komut yok" der (bkz. spec
        # hiddenimports notu). Windows'ta ayrıca konsol kod sayfası sınanmış olur.
        shell: pwsh
        run: |
          # Bu adımın konusu çıkış kodlarıdır, o yüzden kendi çıkış kodunu şansa bırakamaz.
          # Ölçülen: dört iddianın dördü de geçti (`under=3 over=3 misuse=64 nan=64`
          # basıldı, hiçbir istisna yok) ve adım yine **1** ile düştü. GitHub adımı
          # `$ErrorActionPreference='stop'` ile sarar ve sonunda `exit $LASTEXITCODE`
          # çalıştırır; `2>&1 | Out-Null` ise native stderr'i başarı akışına karıştırır.
          # Tam mekanizma yerelde tekrar üretilemedi (pwsh 7.4 konteynerinde aynı kalıp
          # 64 veriyor, 1 değil) — o yüzden sebebi tahmin etmek yerine bağımlılık
          # kaldırıldı: stderr pipeline'a hiç girmiyor ve adım sonucunu kendisi söylüyor.
          # Konteynerde doğrulandı: iddialar geçince 0, biri tutmayınca görünür istisna.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $out = & dist\usage-tracker.exe doctor --json | Out-String
          if ($LASTEXITCODE -gt 1) { throw "doctor exited $LASTEXITCODE" }
          $report = $out | ConvertFrom-Json
          Write-Host "doctor: $($report.problems) problem(s), $($report.warnings) warning(s)"
          if (-not $report.checks) { throw 'doctor produced no checks' }

          # Eşik bir yüzdedir: 0 < n <= 100. Eski matris 200/0 kullanıyordu ("hiçbir şey
          # geçemez" / "her şey geçer" kısayolu); ikisi de artık 64 ile reddediliyor —
          # ulaşılamayan bir çizgi, bu komutun önlemek için var olduğu sessiz `exit 0`'ın
          # ta kendisi. 100 ve 0.1 aynı şeyi sözleşmenin içinden söylüyor.
          & dist\usage-tracker.exe guard --quiet --local --threshold 100 *> $null
          $under = $LASTEXITCODE
          & dist\usage-tracker.exe guard --quiet --local --threshold 0.1 *> $null
          $over = $LASTEXITCODE
          & dist\usage-tracker.exe --not-a-flag *> $null
          $misuse = $LASTEXITCODE
          # NaN'la her karşılaştırma false döner → seviye `ok` → %99 kullanımda "devam et".
          # Argparse tipi bunu reddediyor; donmuş paketin argparse'ı da reddetmek ZORUNDA.
          & dist\usage-tracker.exe guard --quiet --local --threshold nan *> $null
          $nan = $LASTEXITCODE
          Write-Host "under=$under over=$over misuse=$misuse nan=$nan"
          # Runner'da hiç transcript yok → yüzde bilinmeyebilir (3), bu meşru.
          if ($under -notin 0, 3)  { throw "guard under the line returned $under" }
          if ($over  -notin 1, 3)  { throw "guard over the line returned $over" }
          if ($misuse -ne 64)      { throw "misuse must exit 64, not $misuse (2 means crit)" }
          if ($nan -ne 64)         { throw "--threshold nan returned $nan, not 64" }
          exit 0                   # iddialar geçti: adımın cevabı bu, son komutun kodu değil

      - name: Where does it write on Windows
        # W0'ın kodla bulunabilen yarısı. Diğer yarısı (Claude/Codex Windows'ta verisini
        # nereye yazıyor) bir keşiftir ve gerçek makine ister.
        shell: pwsh
        run: python -m usage.platform

      - uses: actions/upload-artifact@v4
        with:
          name: usage-tracker-windows-x64
          path: dist/usage-tracker.exe
          if-no-files-found: error

  linux:
    name: linux binary (old glibc)
    runs-on: ubuntu-latest
    # 🔴 Konteynerin amacı bu: GalleryWeb'in Linux paketi Arch'ta derlendi, oradaki
    # GLIBC_2.43'e bağlandı ve hiçbir LTS dağıtımında açılmadı. Bookworm'un glibc 2.36'sı
    # Debian 12 / Ubuntu 22.04 ve üstünü kapsar. Runner imajının glibc'sine güvenmiyoruz:
    # o sürüm bizden habersiz yükselir ve ikili sessizce daralır.
    container: python:3.13-slim-bookworm
    steps:
      - name: Tools the slim image does not ship
        # Checkout'tan ÖNCE, çünkü ikisi de burada eksik:
        # · `objdump` (binutils) — PyInstaller Linux'ta İSTER, yoksa derlemeye hiç başlamaz
        #   ("On Linux, objdump is required"). Runner imajında var, konteynere geçerken
        #   sessizce kayboluyor; aynı imajda yerelde ölçülünce ilk adımda düştü.
        # · `git` — yoksa actions/checkout tarball geri düşüşüne iner.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends binutils git >/dev/null
          objdump --version | head -1

      - uses: actions/checkout@v4
      - run: pip install pyinstaller
      - run: pyinstaller packaging/usage-tracker.spec --noconfirm --clean

      - name: Report the glibc floor we linked against
        run: |
          ldd --version | head -1
          objdump -T dist/usage-tracker 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -5 || true

      - name: The binary starts and serves the wire
        run: |
          USAGE_PORT=8770 ./dist/usage-tracker &
          for i in $(seq 1 40); do
            sleep 0.5
            if python -c "
          import json,sys,urllib.request
          try: w=json.load(urllib.request.urlopen('http://127.0.0.1:8770/v1/usage', timeout=2))
          except Exception: sys.exit(1)
          cat=w['providers'][0]['spend']['catalog']
          print('schema=%s catalog=%s models=%s' % (w['schema'], cat['source'], cat['modelCount']))
          sys.exit(0 if (w['schema']=='usage/v1' and cat['source']=='bundled'
                         and cat['modelCount']>1000) else 2)
          "; then exit 0; fi
          done
          echo '::error::the binary never served a usable wire'; exit 1

      - name: The binary is also the CLI
        run: |
          ./dist/usage-tracker doctor --json > doctor.json || [ $? -le 1 ]
          python - <<'PY'
          import json, sys
          report = json.load(open('doctor.json', encoding='utf-8'))
          print(f"doctor: {report['problems']} problem(s), {report['warnings']} warning(s)")
          sys.exit(0 if report.get('checks') else 'doctor produced no checks')
          PY
          set +e
          # Eşik bir yüzdedir: 0 < n <= 100 (bkz. windows işindeki not). 200/0 artık 64.
          ./dist/usage-tracker guard --quiet --local --threshold 100; under=$?
          ./dist/usage-tracker guard --quiet --local --threshold 0.1; over=$?
          ./dist/usage-tracker --not-a-flag >/dev/null 2>&1;          misuse=$?
          ./dist/usage-tracker guard --quiet --local --threshold nan >/dev/null 2>&1; nan=$?
          set -e
          echo "under=$under over=$over misuse=$misuse nan=$nan"
          [ "$under" = 0 ] || [ "$under" = 3 ] || { echo "::error::guard under returned $under"; exit 1; }
          [ "$over" = 1 ]  || [ "$over" = 3 ]  || { echo "::error::guard over returned $over"; exit 1; }
          [ "$misuse" = 64 ] || { echo "::error::misuse must exit 64, got $misuse"; exit 1; }
          [ "$nan" = 64 ] || { echo "::error::--threshold nan returned $nan, not 64"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: usage-tracker-linux-x64
          path: dist/usage-tracker
          if-no-files-found: error

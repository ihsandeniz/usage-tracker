# DRAFT — not published. Nothing here has been uploaded to PyPI.
#
# `python3 -m build` produces an sdist and a wheel from this file. The panel's read-only
# resources (`web/`, `data/`, `price_overrides.json`) stay at the repo root, where the source
# run, the AUR package, the PyInstaller spec and the tests expect them; `setup.py` copies them
# into `usage/_res/` inside the wheel (no generic top-level `web`/`data` in site-packages) and
# `usage/platform.py:resource_dir()` finds them there. MANIFEST.in keeps them in the sdist.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-tracker"
dynamic = ["version"]
description = "Claude / AI usage, limits and real spend on your desktop — stdlib only, local files, no account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "ihsandeniz" }]
keywords = ["claude", "claude-code", "usage", "rate-limit", "codex", "waybar"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []    # stdlib only — a promise, see README "Development"

[project.optional-dependencies]
tray = ["PyQt5"]     # surface/usage-tray.py; the panel and CLI never need it

[project.urls]
Homepage = "https://github.com/ihsandeniz/usage-tracker"
Issues = "https://github.com/ihsandeniz/usage-tracker/issues"

[project.scripts]
usage-tracker = "server:main"

[tool.setuptools]
py-modules = ["server"]
packages = ["usage", "usage.providers"]

[tool.setuptools.dynamic]
# One version, in server.py — CI checks the git tag against it. Read statically, not imported.
version = { attr = "server.VERSION" }
